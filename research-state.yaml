project: viettel-ai-race-v1
question: >
  How can an offline Vietnamese clinical NER and coding pipeline improve the
  black-box Viettel AI Race score when the organizer provides only input text
  and no ground-truth annotations?
status: active
execution_bridge:
  h65_notebook: H65_Colab_Stage0.ipynb
  h65_runner: experiments/H65_crosslingual_projection_corrected_execution/run_stage_0_colab.py
  status: translation_pipeline_compatibility_fixed_awaiting_rerun
  local_static_checks: pass
  remote_requirement: "Colab GPU plus GitHub fine-grained token with Contents: Read-only on minggu151623/ViettelAIRACE"
started_at: "2026-07-26"
current_direction: >
  H64's executor stopped safely but did not evaluate its registered hypothesis:
  it sampled Turn2 instead of public data, used raw mention union and token
  overlap instead of exact accepted-span projection, misreported device usage,
  overestimated corpus size and selected a two-type model that cannot meet the
  three-type gate. H64 is inconclusive. Run preregistered H65 on Colab CUDA with
  corrected measurements and a broad-label architecture-distinct pair. H38 at
  39.2813 remains frozen. H63 invalidates the claimed H41 independent-reviewer result on provenance:
  reviewer 1 used hard-coded/keyword rules and reviewer 2 used the existing
  detector, candidate resolver and assertion engine. Their labels are
  quarantined and cannot train H63. Pivot to H64, a feasibility-gated
  Vietnamese-to-English clinical NER ensemble with bidirectional span
  projection and public-source calibration. Keep H38 at 39.2813 frozen.
  Freeze externally confirmed H38 at 39.2813 as the safe fallback. H62 is
  rejected at its deadline checkpoint: only 18 of the first 343 critic-reviewed
  disagreements passed the frozen agreement/evidence contract, far below the
  80-change gate, and parallel Ollama shards contended for one GPU. No H62 ZIP
  exists. H61 passed
  its source gates after Turn2 task-adaptive pretraining but failed all locked
  target boundary-safety gates, so no ZIP was created. The next core branch,
  H62, freezes every span/type/candidate decision and uses a two-stage
  classifier/critic to repair only assertion scope. Its protocol was locked
  before the first LLM assertion label. H59 trained
  an independent PhoNER clinical-boundary teacher and passed its locked source
  gates, but it exactly supported zero H58 Qwen-only target additions, so no
  artifact was created. H60 then tested one-to-one boundary resegmentation:
  all technical gates passed, but a post-build semantic audit found 45
  single-token spans, 33 spans of at most three characters and a median
  new/old length ratio of 0.4667. H60 is rejected and must not be submitted.
  H61 is now preregistered: task-adaptive masked-language pretraining on the
  unlabeled Turn2 input will precede otherwise unchanged PhoNER fine-tuning.
  Its blind target gates explicitly reject the fragment behavior seen in H60.
  H58 previously scored 37.7760 and regressed every component, so aggressive
  Qwen-only recall remains rejected. Earlier history: H24 retains a type-specialist
  candidate retriever. H25 PU calibration failed, while H26's train-only phrase
  source transferred with useful recall. H27's dual-prompt verifier retained
  81.40% of H23-present additions and gained 4.06 dev F1 points, but missed its
  precision-improvement gate and therefore never touched test. Residual errors
  are dominated by incomplete local boundaries that binary KEEP/DROP cannot
  repair. H28 correctly stopped before inference because its ±4-token choice
  set covered only 82.91% of dev targets. H29 then proved 100% eligible choice
  coverage, but Qwen recovered only 37.07% of corrupted spans and damaged
  29.87% of unchanged controls. Prompt-level boundary repair is rejected. The
  next architecture will fine-tune a medical token classifier on H23 train
  records. H30 learned 72.46% dev recall but precision/F1 were only 57.44/64.08%,
  so direct use is rejected. H31 calibrated its frozen confidence and passed:
  threshold 0.90 gives dev/test precision 81.60/84.53% and F1 65.63/62.14%.
  H32 created out-of-fold predictions, retaining 83.06% precision but failing
  recall/F1 at 36.68/50.89% because one fold produced no spans above 0.90.
  H33 per-fold calibration reaches 81.23/38.26/52.02% but the same fold remains
  empty. Its trainer stopped after epoch three and retained epoch one, before
  the late precision gains seen elsewhere. H34's minimum-five-epoch safeguard
  repairs it: substituted aggregate precision/recall/F1 is
  82.23/46.15/59.12%. One fold recall gate misses by 0.57 points, so H34 remains
  formally failed. The next step is a read-only independent-agreement audit of
  these frozen OOF predictions. H35 finds 51 novel exact agreements (45
  VietMed, eight held-out phrase, two both), but two known fused hazards remain.
  H36's controlled dual verifier passes every frozen gate: 90% positive-control
  retention, 100% registered-hazard rejection, 92.59% prompt agreement and 42
  accepted novel rows. H37 integrates 22 symptom-boundary replacements and four
  additions, but gains only 0.0368 externally. H38 scales to exact 3-of-5
  agreement across five frozen views and changes 183 rows over 68 records. It
  scores 39.2813, only +0.3093: text and candidates improve, assertions slip.
  This validates consensus directionally but closes same-family expansion as a
  breakthrough path. H39 then passes its correlated-noise simulation but fails
  15/19 real leave-one-family-out cells, proving the sources encode incompatible
  policies rather than one recoverable latent vote. Turn 2 exposes 271 repeated-
  line groups covering 43.07% of characters, but H40 canonical stability is only
  88.37% and its 551 changes exceed the registered ceiling. Repetition cannot
  invent the missing policy. H41 now freezes a prediction-blind 60-passage
  queue spanning 164 exact occurrences and 55,200 projected characters, with
  a 45/15 development/holdout split and an independent 15-passage reviewer-2
  queue. The next model experiment is blocked until both reviewers complete and
  checksum-lock their labels; no model output may be exposed before that lock.
  H42 repaired the preregistered statistical gate before labels: occurrence-
  level bootstrap is anti-conservative under repeated-passage correlation, so
  the frozen evaluator now scores passage-local windows and resamples the 15
  unique holdout passages within multiplicity strata. With five leaderboard
  slots reset, H43's full-head LLM pruning was rejected because it reproduced
  only 1/19 frozen hazards despite 100% same-run seed agreement. H44 pivots to
  the externally supported H23 mechanism and expands the same-family WHO hedge
  to 611 singleton diagnoses across 97 records. It passes all local gates and
  is the next submission candidate; external measurement is pending. Its
  interpretation is now locked before score reveal: metric invariants are
  checked first, then candidate deltas branch at ±0.02 and +0.50 rather than
  being rationalized after the result. While waiting, H45 directly optimizes
  ranked-prefix Jaccard on H24's frozen weak-link split. Dev selects k=1 for
  both types; test falls monotonically from 0.17857 at k=1 to 0.03912 at k=10.
  Generic candidate-list expansion is closed: ranking depth without calibrated
  row-level set size is not a submission mechanism. H46 then tests the missing
  row-level score-shape mechanism: diagnosis dev Jaccard rises by 0.01786, but
  the confidence interval includes zero and mean k exceeds its ceiling. Test is
  canceled by protocol. Candidate cardinality now requires independent labels,
  not another weak-link feature family. H47 then isolates the repeated negative
  assertion movement on H37/H38 novel spans. Only 36 novel entities are
  asserted, and their two observed component losses sum to 0.04605 weighted
  score points, below the 0.10 leverage gate. Blanket assertion abstention is
  closed as another reset-slot mechanism. H44 then scores 35.4639: WER and
  assertions remain identical to H38, but candidate Jaccard collapses by
  9.5437. Broad parent expansion is rejected and H38 remains frozen at 39.2813.
  H56 confirms that ZIP size is a confounded recall proxy, not an objective:
  entity/assertion coverage explains the historical trend, while V2 and H44
  are externally scored counterexamples. The next challenger must freeze H38
  candidates and increase only independently supported semantic coverage.
baseline:
  best_submitted_artifact: turn2/output_v10_multiview_consensus.zip
  score: 39.2813
  wer_percent: 56.1576
  j_assertion: 47.3920
  j_candidates: 29.7776
  score_formula: "score% = 0.3*(100-WER%) + 0.3*J_assertion% + 0.4*J_candidates%"
  verified_formula: >
    0.3*(100-56.1576) + 0.3*47.3920 + 0.4*29.7776 = 39.28136.
constraints:
  - "No organizer ground truth is available."
  - "Inference must remain offline and deterministic."
  - "Leaderboard submissions are scarce and must be treated as expensive tests."
  - "The older organizer overview demonstrates parent/specific ICD candidates, but its OCR strings are not clean gold."
hypotheses:
  H1_text_type_precision:
    status: weakened
    prediction: >
      Removing generic headings, nested spans, procedure mentions, and
      unsupported attributes will improve text_score more reliably than adding
      recall-oriented model spans.
  H2_candidate_calibration:
    status: supported_by_internal_and_independent_blackbox_ablation
    prediction: >
      Unsupported ICD candidates should be removed, but mature diagnosis
      linking must recover defensible parent/specific codes shown by the
      organizer overview.
  H3_assertion_scope:
    status: weakened
    prediction: >
      Section-aware and local-scope assertion rules improve assertions without
      changing text spans.
  H4_multi_teacher_consensus:
    status: refuted
    prediction: >
      Agreement between independent rule, VietMed-NER, and LLM proposals can
      identify high-confidence spans, but raw union or unconstrained structured
      generation will reduce precision.
  H5_supervised_adaptation:
    status: locally_supported
    prediction: >
      PEFT/PhoBERT-style supervised adaptation could improve span/type/assertion
      quality only after a trustworthy labeled set is created; pretrained-only
      inference is not a valid decision model.
  H6_public_supervised_transfer:
    status: rejected_after_threshold_calibration
    prediction: >
      ViMedNER boundary/type pretraining could improve Vietnamese medical span
      representations because its taxonomy includes disease, symptom,
      diagnostic, and treatment, but training is blocked until dataset licensing
      is clarified and BTC-specific labels are adapted separately. VietBioNER
      is licensed for attributed boundary pretraining but cannot directly split
      its combined disease/symptom class; diagnostic-only transfer is rejected
      because source threshold calibration peaks at precision 0.5.
  H7_crlf_coordinates:
    status: externally_supported
    prediction: >
      Projecting LF offsets to CRLF coordinates will improve matching if hidden
      annotations retain the official example's Windows newline coordinates.
  H8_rxnorm_semantic_reranking:
    status: exact_scd_route_rule_unit_tested_external_effect_unidentified
    prediction: >
      Ranking by supported ingredients, strength, route, and form instead of
      numeric RxCUI order will remove at least 15 contradictory V6 mappings.
  H10_i2b2_policy_prior:
    status: structurally_supported_not_provenance
    prediction: >
      Adapted i2b2 boundary rules can improve consistency of independently
      created Vietnamese annotations, but direct label conversion will fail on
      BTC-specific type splits and multilabel assertions.
  H11_phrase_specific_boundaries:
    status: supported_by_official_sample
    prediction: >
      Adjacent symptom boundaries require lexical and contextual evidence;
      global split-all or merge-all transformations will introduce official-
      policy contradictions.
  H12_transferred_source_schema:
    status: templating_supported_task_family_plausible_named_source_unproven
    prediction: >
      The records were translated/restructured through a shared template, so
      section features and bilingual terminology will outperform purely free-
      text Vietnamese priors; exact source-label transfer requires alignment.
  H13_experiencer_not_reporter:
    status: strongly_supported_semantically_external_effect_unidentified
    prediction: >
      isFamily should apply only when the concept belongs to a relative, not
      when a relative reports the patient's condition; removing reporter-based
      family labels should improve assertion score in an isolated test.
  H14_split_lab_name_result:
    status: bounded_split_implemented_and_validated_bundle_regression_unisolated
    prediction: >
      Splitting high-confidence numeric laboratory rows into independent test
      name and value-plus-unit spans will improve type/boundary matching over
      V6 compound result spans.
  H15_specialist_core_ensemble:
    status: exact_three_model_core_built_external_effect_pending
    prediction: >
      Heterogeneous, type-specialist span models with a learned merger and
      CRLF-aware offsets can improve text/type matching materially, whereas
      raw model union and post-processing alone cannot bridge the score gap.
  H21_blind_promotion_gate:
    status: infrastructure_complete_awaiting_blind_annotation
    prediction: >
      A prediction-blind, structurally stratified review set and paired
      bootstrap gate can reject unstable challengers offline; selective
      fallback preserves H20 whenever evidence is insufficient.
  H22_calibrated_pseudo_reconstruction:
    status: externally_supported_all_components_improved
    prediction: >
      Removing synthetic calibration rows from an independent higher-recall
      pseudo-label reconstruction will improve span/type, assertion and
      candidate matching together relative to H20.
  H23_candidate_only_semantic:
    status: externally_supported_small_gain_axis_closed
    prediction: >
      Adding a valid same-family WHO parent beside ICD-10-CM-specific singleton
      candidates will hedge organizer ontology differences and improve
      candidate Jaccard without changing text or assertion metrics.
  H24_ontology_graph_classifier:
    status: linker_inner_loop_closed_router_retained_span_assertion_outer_loop_next
    prediction: >
      A customized sparse+dense concept retriever with ontology-graph losses,
      graph-mined hard negatives and a contextual classifier/reranker will
      improve both span/type selection and candidate normalization beyond H23;
      copying an unchanged biomedical checkpoint will not.
  H25_positive_unlabeled_span_assertion:
    status: rejected_heldout_precision_and_assertion_stability_gates_failed
    prediction: >
      Record-held-out PU calibration over three proposal banks could recover
      H23-like additions without treating missing weak labels as negatives.
    result: >
      Contextual PU added only 0.39/0.40 strict-F1 points on dev/test with
      41.67/36.84% addition precision. Assertion learning regressed dev despite
      improving test. Correlated fused-boundary errors survived high-stability
      filtering, so H23 remains unchanged.
  H26_phrase_policy_distillation:
    status: promising_proposal_source_precision_gate_failed
    prediction: >
      High-purity phrase/type rules learned only from train records can transfer
      recurring annotation policy to held-out records independently of model
      confidence.
    result: >
      A 235-phrase lexicon improved strict F1 by 4.08 points on dev and 1.32 on
      test, but addition precision was only 50.59/36.11%. Contextual homonyms
      and substrings require semantic verification before merging.
  H36_controlled_dual_verifier:
    status: passed_queue_only
    prediction: >
      Independent exact agreement followed by two frozen semantic/boundary
      prompts can isolate novel spans while retaining known-correct controls
      and rejecting registered fused-token hazards.
    result: >
      Retained 27/30 positive controls, rejected both hazards, achieved 92.59%
      prompt agreement and accepted 42/51 novel rows. Direct merge remains
      forbidden; symptom-only integration is the registered successor.
  H37_verified_symptom_boundary:
    status: externally_supported_negligible_gain_axis_closed
    prediction: >
      Independently supported, dual-verified symptom cores can repair H23's
      inflated boundaries without risking ICD/RxNorm candidate score.
    result: >
      Applied 22 boundary rows and four disjoint additions. External WER
      improved 0.2528 but assertion Jaccard fell 0.1301; candidates were fixed,
      yielding only +0.0368 total. Do not extend this with another micro-queue.
  H38_multiview_consensus:
    status: externally_supported_positive_but_insufficient_axis_closed
    prediction: >
      Exact agreement among at least three of five heterogeneous frozen views,
      followed by dual verification and conservative candidate handling, can
      scale the positive H37 boundary signal to architecture-level coverage.
    result: >
      Selected 183 rows across 68 records; retained 91.67% of controls, rejected
      all registered hazards, validated 100/100 files and reproduced identical
      ZIP bytes. External score reached 39.2813 (+0.3093), driven by WER and a
      smaller candidate gain while assertions slipped. Do not tune another
      consensus threshold on these correlated sources.
  H39_dependency_aware_label_model:
    status: rejected_real_leave_one_family_out_gate_failed
    prediction: >
      Modeling type-specific source accuracy and source dependence as latent
      variables, then cross-fitting a contextual stacker, will outperform exact
      majority voting under correlated-noise and leave-one-family-out gates.
    result: >
      Synthetic F1 improved 0.69350 to 0.81017, but only 4/19 real held-out
      source/type cells improved log-loss. Sources encode incompatible policies;
      stacker and artifact generation were canceled.
  H40_repeated_passage_consistency:
    status: rejected_stability_and_change_window_failed
    prediction: >
      Aggregating independent family evidence across literally identical Turn-2
      passage occurrences will recover a stable canonical local annotation
      policy without treating correlated checkpoints as independent labels.
    result: >
      Retained 47/48 controls, but leave-one-occurrence-out stability reached
      only 88.37% and 551 proposed row changes exceeded the 400-row ceiling.
      Integration and ZIP generation were canceled.
  H41_repeated_passage_blind_annotation:
    status: rejected_inter_reviewer_agreement_gate_failed
    prediction: >
      Prediction-blind annotation of unique repeated passages will provide an
      independent development/holdout signal and multiply each reviewed local
      policy across exact occurrences without using model agreement as truth.
    result: >
      Reviewer 1 (6ec3707c343f) and Reviewer 2 (e11d9f8cb207) double-annotations
      completed and checksum-locked across 15 holdout passages. Inter-reviewer
      strict span/type F1 reached 0.4252 (gate >= 0.85) and assertion macro-Jaccard
      reached 0.1317 (gate >= 0.80). Both agreement gates failed; model training was
      canceled and no ZIP was generated. Retain H38 baseline 39.2813.
  H42_h41_cluster_gate:
    status: supported_by_preregistered_simulation
    prediction: >
      Exact repeated occurrences are correlated evidence, so occurrence-level
      bootstrap will inflate false promotions while passage-stratified cluster
      bootstrap will retain near-nominal error under correlated nulls.
    result: >
      At within-passage correlation 0.6, false promotion fell 10.55% -> 5.43%;
      at 0.9 it fell 13.28% -> 5.10%. Both locked reduction gates passed. The
      H41 evaluator now scores only labeled passage windows, rejects boundary-
      crossing predictions and resamples 15 unique passages within strata.
  H43_candidate_contradiction_surgery:
    status: rejected_prompt_instability_gate
    prediction: >
      Two-pass full-head ontology review can remove contradictory H38 ICD/RxNorm
      codes while freezing extraction and assertions.
    result: >
      Current seeds agreed 100% and proposed 118 controlled removals, but only
      1/19 prior known-title hazard uses was reproduced versus the locked 80%
      gate. The ZIP was deleted; same-prompt agreement is temporally unstable.
  H44_full_who_family_hedge:
    status: externally_rejected_retain_h38
    prediction: >
      Extending H23's externally positive same-family WHO parent hedge to every
      singleton diagnosis-specific code will recover a corpus-wide mixed-
      hierarchy target policy while freezing WER and assertions.
    result: >
      The exact frozen ZIP scored 35.4639. WER and assertion Jaccard were
      invariant, while candidate Jaccard fell 29.7776 -> 20.2339. The loss is
      attributable to broad parent insertion; retain H38 and forbid this policy.
  H48_h41_power_curve:
    status: supported_type_i_underpowered_moderate_effect
    prediction: >
      H41's frozen 15-passage holdout will both retain near-nominal Type-I error
      and achieve at least 80% power for a standardized passage-level effect of
      0.5 under its preregistered stratified percentile-bootstrap gate.
    result: >
      Type-I passed at 0.053, but power at d=0.5 was only 0.5882. The frozen
      holdout reached 0.8748 at d=0.75; 30 independent passages were required
      to reach 0.8034 at d=0.5. H41 is a high-effect confirmation gate, not an
      equivalence test, and its frozen queue remains unchanged.
  H49_h41_power_robustness:
    status: supported_distribution_sensitive
    prediction: >
      H48's qualitative power conclusion and larger-queue direction will remain
      defensible across discrete, skewed and heavy-tailed unit-variance passage
      deltas, with 15-passage Type-I remaining between 0.02 and 0.08.
    result: >
      The qualitative underpower conclusion survived, but universal Type-I
      control failed: the 15-passage range was 0.0236–0.1126. Worst-family
      power at d=0.5 was 0.7452 for 30 passages and 0.8546 for 45, moving the
      robust 80% count from 30 to 45. The percentile gate requires repair.
  H50_h41_inference_repair:
    status: rejected_no_eligible_small_n_method
    prediction: >
      Studentization can reduce H49's left-skew Type-I inflation while
      retaining at least 0.50 worst-family power at d=0.5 and avoiding
      discrete-sample numerical failure on the frozen 15-passage holdout.
    result: >
      Percentile retained 0.5680 power but reached 0.1132 Type-I. Welch-t
      reduced maximum Type-I to 0.0724 but worst power fell to 0.3448 and
      minimum Type-I to 0.0030. Bootstrap-t power was 0.2880 and 4.62% of
      Rademacher replications were nonfinite. No method was eligible or installed.
  H51_h41_bounded_gate:
    status: rejected_valid_but_vacuous
    prediction: >
      The exact [-1,1] passage-delta range permits a finite-sample
      distribution-free gate with controlled Type-I and useful power at H41's
      current or modestly expanded sample sizes.
    result: >
      Type-I was zero, but usefulness failed completely. Hoeffding subtracts
      0.7013 at n=15 and 0.3507 at n=60; stratum-wise empirical Bernstein is
      wider. Worst-family power was zero through d=1 for every n≤60. No gate
      was installed and the synthetic statistical-repair branch is closed.
  H52_h44_transfer_calibration:
    status: supported_pre_result_lineage_correction
    prediction: >
      Stable occurrence identities will clarify H44's disjoint exposure and
      convert its locked candidate-delta gates into H23-equivalent transfer
      ratios without using the pending external result.
    result: >
      H23's 144 and H44's 611 rows have zero overlap; union exposure is 755.
      Full H23 per-row yield implies +1.4600 candidate Jaccard. The existing
      +0.02/+0.50 gates equal 1.37%/34.25% yield. Counts and interpretation were
      corrected before score reveal; numerical gates and H44 ZIP stayed fixed.
  H53_h44_exposure_concentration:
    status: supported_family_only_breadth_correction
    prediction: >
      Row-count calibration may overstate H44's diversity if repeated mentions
      concentrate the 611 changes in a small set of WHO families or lexical
      units; preregistered concentration metrics can bound the interpretation
      before the external score is revealed.
    result: >
      Family breadth passes: 148 unique families, effective count 47.4782 and
      top-five share 0.2471. Lexical breadth fails: 286 strictly normalized
      mention-specific units have effective count 89.7622 below the gate of
      100, despite top-ten share 0.2406. H44 can support broad family transfer,
      not broad lexical transfer; artifact and numerical gates stayed fixed.
  H54_h44_family_novelty_decomposition:
    status: supported_cross_family_extrapolation_correction
    prediction: >
      H44's broad family census may be dominated by parent families never
      touched by H23, making the aggregate submission primarily a test of
      cross-family extrapolation rather than within-family interpolation.
    result: >
      H23-novel families contain 461/611 H44 rows (75.45%) and 120/148
      families (81.08%), passing the dominance gate. The H23-seen stratum is
      still material at 150 rows across 28 families. Negative H44 would reject
      broad extrapolation, not erase H23; strong positive would establish
      transfer into untouched families. ZIP and numerical gates stayed fixed.
  H55_h44_external_result_recorder:
    status: passed_and_recorded_negative_h44
    prediction: >
      Loading the frozen decision tree mechanically can eliminate remaining
      result-ingestion risks without adding another speculative H44 audit.
    result: >
      All eight registered synthetic cases map correctly: four identity or
      metric anomalies stop attribution, while strong/small/null/negative map
      to the exact frozen decisions. The submitted H44 hash and metrics pass
      every identity/invariance check and mechanically select RETAIN_H38.
  H56_semantic_size_proxy:
    status: rejected_archive_size_as_selector
    prediction: >
      Archive size may proxy missing recall, but it is useful for submission
      selection only if the association survives same-architecture external
      counterexamples and semantic-size decomposition.
    result: >
      ZIP bytes correlate 0.9817 with score across nine sequential runs, but
      entity/assertion counts correlate at least as strongly. V2 is smaller yet
      better than baseline; H44 adds 611 candidates yet loses 3.8174 points.
      Use semantic coverage only as a recall diagnostic; padding and unsupported
      cardinality expansion are forbidden.
  H64_crosslingual_clinical_projection:
    status: invalid_execution_hypothesis_inconclusive
    prediction: >
      Cross-lingual translation to English, clinical NER with two independent
      English models and bidirectional span projection can add high-precision
      entities without relying on Vietnamese proposal sources.
    result: >
      Executor stopped safely and created no ZIP, but used Turn2 lines rather
      than public data, raw union/token overlap rather than registered exact
      accepted projections, no actual MPS device argument, an inflated assumed
      corpus size and a model pair unable to cover three BTC types. The reported
      metrics do not test H64. Retain H38 and run corrected H65.
  H65_crosslingual_projection_corrected_execution:
    status: preregistered
    prediction: >
      A CUDA-batched, protocol-faithful execution with a broad-label
      DistilBERT/DeBERTa pair can separately establish projection alignment,
      exact-offset fidelity, public-gold quality and runtime feasibility before
      any Turn2 inference. Failure of any frozen gate creates no ZIP.
