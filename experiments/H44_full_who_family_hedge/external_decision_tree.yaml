pre_result_exposure_calibration:
  audit: H52_h44_transfer_calibration
  h23_changed_rows: 144
  h44_additional_disjoint_rows: 611
  exact_overlap_rows: 0
  union_parent_hedge_rows: 755
  h23_candidate_delta_per_row: 0.0023895833
  linear_candidate_delta_at_100_percent_h23_per_row_yield: 1.4600354167
