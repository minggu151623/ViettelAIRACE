pre_result_family_novelty_decomposition:
  audit: H54_h44_family_novelty_decomposition
  h23_seen_family_rows: 150
  h23_seen_parent_families: 28
  h23_seen_row_share: 0.245499
  h23_novel_family_rows: 461
  h23_novel_parent_families: 120
  h23_novel_row_share: 0.754501
  h23_novel_family_share: 0.810811
  novel_family_dominant: true
  seen_family_subgroup_material: true
  interpretation: >
    H44 is primarily a cross-family extrapolation test, not merely new codes
    and mentions inside H23-touched families. A negative aggregate result
    rejects indiscriminate expansion into new families but cannot erase H23's
    observed CM-exclusive gain. The frozen 150-row/28-family seen stratum is
    large enough for a separately preregistered post-result ablation if the
    aggregate branch warrants one; no such artifact exists now.

branch_order:
  - id: validation_anomaly
    when: >
      abs(delta_WER) > 0.0001 OR abs(delta_J_assertion) > 0.0001 OR
      abs(delta_score - 0.4*delta_J_candidates) > 0.0002.
    interpretation: >
      The returned metrics are not attributable to the candidate-only H44
      transform, or the wrong artifact/result was recorded.
    action: >
      Stop interpretation, verify the submitted ZIP SHA-256 and transcribed
      metrics, and do not construct a follow-up artifact.

  - id: strong_positive
    when: >
      delta_J_candidates >= 0.5, delta_score >= 0.2, and all derived checks pass.
    interpretation: >
      The hierarchy mechanism generalizes materially beyond CM-exclusive rows,
      retaining at least 34.25% of H23's exposure-normalized per-row yield.
      This supports transfer across broad WHO-family exposure, but does not
      prove broad lexical transfer or universal row prevalence. Because 75.45%
      of H44 rows are in H23-untouched families, it specifically supports
      cross-family extrapolation.
    action: >
      Promote H44 to best baseline. Do not sweep thresholds; use the remaining
      slots only for a distinct, preregistered mechanism or the H41 blind-label
      challenger.

  - id: small_positive
    when: >
      delta_J_candidates > 0.02 but < 0.5 and all derived checks pass.
    interpretation: >
      The hierarchy hedge transfers weakly across the 611 H44 rows, retaining
      roughly 1.37% to 34.25% of H23's exposure-normalized per-row yield. The
      effect is too diluted for another indiscriminate expansion, and H53's
      lexical-breadth failure forbids claiming broad surface-form transfer.
    action: >
      Keep H44 only if its total score is higher than H38. Freeze broad family
      expansion. If another slot is later justified, preregister the already
      frozen 150-row H23-seen-family stratum before building it; do not select
      a subgroup after inspecting row-level behavior.

  - id: practical_null
    when: >
      abs(delta_J_candidates) <= 0.02 and all derived checks pass.
    interpretation: >
      The evaluator is effectively insensitive to the additional broad hedge,
      or matched gains and penalties cancel at displayed precision. The
      absolute movement is no more than about 1.37% of H23-equivalent per-row
      yield under the linear exposure calibration.
    action: >
      Retain H38, close generalized hierarchy expansion, and move effort to H41
      prediction-blind labels rather than another ontology sweep.

  - id: negative
    when: >
      delta_J_candidates < -0.02 and all derived checks pass.
    interpretation: >
      H23 was specific to ontology-version mismatch; broad parent insertion
      reduces candidate precision. More precisely, H54 shows the aggregate is
      dominated by extrapolation to H23-untouched families, so this does not
      negate H23's observed CM-exclusive effect.
    action: >
      Reject H44, retain H38, forbid further broad parent expansion, and pivot
      primary effort to independently labeled span/assertion policy. The frozen
      H23-seen-family subgroup may be considered only as a separately
      preregistered post-result ablation, never by retrospective row selection.

result_fields_to_record:
  - submitted_zip_sha256
  - score
  - wer_percent
  - j_assertion
  - j_candidates
  - branch_id
  - decision
