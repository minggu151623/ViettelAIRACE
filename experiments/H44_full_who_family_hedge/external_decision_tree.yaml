derived_checks:
  score_formula: "score = 0.3*(100-WER) + 0.3*J_assertion + 0.4*J_candidates"
  expected_wer_delta: 0.0
  expected_assertion_delta: 0.0
  invariant_display_tolerance: 0.0001
  score_reconciliation_tolerance: 0.0002
