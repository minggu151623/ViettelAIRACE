    - text
    - type
    - position
    - assertions
    - every_drug_candidate
    - every_noneligible_diagnosis_candidate
  no_model_or_reviewer: true

registered_gates:
  - source_zip_hash_matches
  - exactly_611_rows_change_across_exactly_97_records
  - every_change_is_singleton_to_same_family_parent_plus_specific
  - zero_candidate_removals
  - zero_non_candidate_field_changes
  - all_3226_entities_and_100_records_validate
  - two_full_builds_are_byte_identical
  - two_ZIP_builds_are_byte_identical

failure_policy: >
