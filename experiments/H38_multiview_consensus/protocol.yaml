integration_policy:
  contained_same_type:
    action: replace_containing_rows
    assertions: inherit_union_from_replaced_rows
    candidates: inherit_union_from_replaced_rows
  disjoint_non_candidate_type:
    action: add
    assertions: unchanged_rule_engine
  disjoint_diagnosis_or_drug:
    action: add_only_if_normalized_H37_alias_has_one_unanimous_nonempty_candidate_tuple
