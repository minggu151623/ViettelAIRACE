  - verifier_responses_complete
  - positive_control_retention_at_least_0.85
  - registered_hazard_drop_rate_equals_1
  - prompt_action_agreement_at_least_0.80
  - at_least_150_rows_survive_all_filters
  - zero_cross_type_partial_or_contains_changes
  - all_100_records_validate
  - repeated_output_and_zip_are_byte_identical

if_passed:
  output: turn2/output_v10_multiview_consensus
  zip: turn2/output_v10_multiview_consensus.zip
  status: candidate_artifact_not_submitted

failure_policy: >
  Do not lower the three-view threshold, loosen structural relations, invent a
  candidate, or edit verifier prompts after observing results. If fewer than
  150 rows survive, create no ZIP and return to architecture/data work.
