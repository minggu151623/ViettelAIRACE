hypothesis: H56_semantic_size_proxy
status: exploratory_audit
created_at: "2026-08-03T15:00:00+07:00"
question: >
  Is submission archive size a useful blind proxy for score, and which semantic
  quantity actually explains the observed association?

inputs:
  unit: externally_scored_turn2_submission
  runs:
    - [baseline, turn2/output.zip, 16.6673]
    - [v2_llm_guarded, turn2/output_v2_llm_guarded.zip, 19.0709]
    - [v3_ensemble_core, turn2/output_v3_ensemble_core.zip, 21.4739]
    - [v4_pair_qwen, turn2/output_v4_pair_qwen.zip, 21.8139]
    - [v7_h22, turn2/output_v7_pseudo_reconstruction.zip, 38.7976]
    - [v8_h23, turn2/output_v8_candidate_semantic.zip, 38.9352]
    - [v9_h37, turn2/output_v9_verified_symptoms.zip, 38.9720]
    - [v10_h38, turn2/output_v10_multiview_consensus.zip, 39.2813]
    - [v12_h44, turn2/output_v12_full_who_family_hedge.zip, 35.4639]

measurements:
  - zip_bytes
  - canonical_minified_json_bytes
  - entity_count
  - candidate_count
  - assertion_count
  - mention_characters

interpretation_rules:
  - correlation_is_not_causal_because_runs_are_sequentially_improving
  - formatting_and_compression_bytes_are_not_semantic_evidence
  - a_same_entity_counterexample_overrides_archive_size_as_a_selection_rule
  - semantic_coverage_may_be_used_only_as_a_recall_diagnostic
  - padding_or_unsupported_candidate_expansion_is_forbidden

decision_gate: >
  Archive size may become a submission selector only if it predicts score within
  a fixed semantic architecture and has no externally scored counterexample.

result:
  decision: REJECT_ARCHIVE_SIZE_AS_SELECTOR
  rationale: >
    H44 freezes H38 entities, spans, types and assertions while adding 611
    candidate values; its score falls 3.8174. V2 is also smaller than the
    original baseline while scoring 2.4036 higher. The large global correlation
    is confounded by successive entity-recall improvements.
