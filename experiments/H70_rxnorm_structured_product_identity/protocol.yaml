baseline:
  artifact: turn2/output_v24_rxnorm_exact_brand_identity.zip
  sha256: 12090622102ab333f3f697161953f1fdd1a799488ea0656a9fc0582c16462369
  external_score: 40.2216
  wer_percent: 56.1576
  assertion_jaccard_percent: 47.3920
  candidate_jaccard_percent: 32.1281

question: >
  After exact brand identity is externally supported, does resolving explicit
  ingredient-or-brand plus strength plus route/form to an exact RxNorm SCD/SBD
  improve candidate Jaccard further?

prediction: >
  H69 shows that the organizer rewards the concept identity expressed by the
  span. When a span additionally states strength and route/form, an exact
  singleton clinical drug product is more faithful than a bare IN/BN concept.

ontology: RxNorm_Current_Prescribable_Content_2026_07_06

frozen_fields:
  - all_entities_and_order
  - text_type_position_assertions
  - all_diagnosis_candidates
  - all_H69_exact_brand_replacements
  - all_unselected_drug_candidates

eligibility:
  - entity_type_equals_THUOC
  - current_candidate_cardinality_equals_one
  - current_candidate_TTY_is_IN_PIN_MIN_or_BN
  - entity_span_contains_an_explicit_strength_number_and_unit
  - entity_span_itself_contains_explicit_IV_PO_uong_vien_tablet_capsule_or_injection_evidence
  - one_active_SCD_or_SBD_matches_the_identified_ingredient_or_brand
  - candidate_matches_every_explicit_strength_route_and_form_field
  - candidate_contains_no_extra_ingredient_absent_from_the_span
  - candidate_is_unique_after_all_filters

specialization_rules:
  - branded_span_prefers_exact_SBD_when_one_exists
  - generic_span_prefers_exact_SCD
  - brand_may_use_SCD_only_when_no_matching_SBD_exists_and_all_fields_match
  - concentration_may_roundtrip_to_explicit_total_dose_only_with_exact_volume
  - schedule_numbers_are_not_strengths
  - missing_or_ambiguous_form_means_UNCHANGED

prohibited:
  - candidate_fill_from_repeated_target_mentions
  - fuzzy_ingredient_translation
  - local_context_route_leakage_from_an_adjacent_drug
  - product_with_additional_unmentioned_ingredient
  - replacement_between_two_already_structurally_matching_products
  - top_k_or_multi_candidate_output
  - any_threshold_change_after_build_audit

gates:
  minimum_changed_rows: 5
  maximum_changed_rows: 20
  minimum_changed_records: 4
  all_new_codes_active_TTY_SCD_or_SBD: true
  explicit_field_contradictions: 0
  extra_ingredient_contradictions: 0
  all_H69_frozen_fields_identical: true
  all_100_records_validate: true
  deterministic_zip_bytes: true
  project_tests_pass: true

artifact:
  output_directory: turn2/output_v25_rxnorm_structured_product_identity
  zip_path: turn2/output_v25_rxnorm_structured_product_identity.zip
  submission_policy: user_only_after_reviewing_exact_sha256

interpretation_contract:
  - WER_and_assertion_must_equal_H69
  - candidate_increase_supports_exact_product_specialization
  - candidate_decrease_reverts_to_H69_and_rejects_product_specialization
