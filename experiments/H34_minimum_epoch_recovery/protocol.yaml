hypothesis: H34_minimum_epoch_safeguard_recovers_collapsed_fold
status: preregistered
created_at: "2026-08-03T02:30:00+07:00"
question: >
  Did H32 fold 4 collapse because early stopping was allowed before the
  class-weighted token model reached its late high-confidence regime?

scope:
  rerun_fold_index: 3
  inference_records: frozen_from_airace.crossfit_voter.make_folds_seed_9191
  validation_records: next_fold_cyclic
  training_records: remaining_60
  all_other_H33_fold_predictions: frozen

model_and_training:
  base: models/bami-airace-v15-weighted
  seed: 4334
  max_length: 256
  stride: 64
  epochs_max: 8
  learning_rate: 0.00002
  batch_size: 4
  gradient_accumulation: 4
  class_weighting: true
  patience: 2
  only_change:
    minimum_epochs_before_early_stop: 5
  selection_metric: validation_strict_exact_span_type_F1

calibration:
  thresholds: [0.50, 0.60, 0.70, 0.80, 0.85, 0.90, 0.95]
  selection: highest_validation_F1_subject_to_precision_at_least_0.80
  tie_break: higher_precision_then_higher_threshold

fold_recovery_gate:
  - eligible_nonempty_validation_threshold
  - inference_precision_at_least_0.75
  - inference_F1_at_least_0.50
  - inference_recall_at_least_0.40
  - deterministic_inference
  - offset_errors_equal_0

substituted_aggregate_gate:
  - precision_at_least_0.78
  - F1_at_least_0.55
  - recall_at_least_0.40
  - every_fold_nonempty

if_all_pass:
  generate: H32_independent_agreement_queue
  direct_merge: forbidden
  zip_creation: forbidden

failure_policy: >
  Do not change seed, patience, threshold grid or train data. If the fold does
  not recover, reject the current cross-fit architecture rather than run more
  seeds blindly.
