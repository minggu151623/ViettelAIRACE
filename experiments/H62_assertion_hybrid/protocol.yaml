hypothesis: H62_two_stage_assertion_hybrid
status: preregistered_before_first_llm_label
created_at: "2026-08-03T21:40:00+07:00"
baseline:
  artifact: turn2/output_v10_multiview_consensus.zip
  sha256: a9b9ae07997e57080ed8ce2ad9c390f4cd8c229e8eae8de447f6f47ae6ff4d0b
  external_score: 39.2813
  frozen_fields: [text, type, position, candidates, entity_count]
question: >
  Can a two-stage clinical-context LLM correct assertion scope for existing
  H38 entities without disturbing entity matching or candidate linking?
literature:
  primary: https://pmc.ncbi.nlm.nih.gov/articles/PMC2757457/
  supported_claim: >
    ConText models negation, temporality and experiencer using triggers, scope,
    termination and pseudo-triggers; historical status needs evidence beyond
    surface cues and portability differs by document type.
model:
  name: qwen3:8b
  id: 500a1f067a9f
  temperature: 0
  input_labels: [isNegated, isHistorical, isFamily]
  eligible_types: [CHẨN_ĐOÁN, TRIỆU_CHỨNG, THUỐC]
  multilabel: true
stage_one:
  role: direct_clinical_assertion_classifier
  input: local_context_plus_section_heading_plus_exact_entity_ids
  output: assertion_set_per_entity
stage_two:
  role: disagreement_critic
  input: only_rows_where_stage_one_differs_from_H38
  policy: hide_global_counts_and_leaderboard_metrics
  output: final_assertion_set_plus_exact_evidence_quote_and_scope_category
integration:
  accept_change_only_if:
    - stage_one_and_stage_two_assertion_sets_are_identical
    - every_positive_label_has_a_verbatim_evidence_quote_in_supplied_context
    - every_removed_label_has_a_scope_category_from_the_frozen_enum
  failure_on_invalid_or_missing_row: retain_H38_assertions
  preserve_multilabel_combinations: true
gates:
  - baseline_hash_matches
  - qwen_model_id_matches
  - at_least_80_and_at_most_500_assertion_rows_changed
  - all_non_assertion_fields_are_identical
  - zero_assertions_on_ineligible_types
  - malformed_or_missing_rate_at_most_0.01
  - all_positive_evidence_quotes_round_trip
  - all_100_records_validate
  - repeated_merge_and_zip_are_byte_identical
failure_policy: no_submission_artifact_if_any_gate_fails
interpretation_limits:
  - Two prompts to the same model are correlated, not independent annotators.
  - No organizer assertion gold is available.
  - The artifact may isolate assertion-score movement but cannot guarantee gain.
