hypothesis: H53_h44_exposure_concentration
status: preregistered
created_at: "2026-08-03T06:01:18+07:00"
question: >
  Do H44's 611 changed rows represent broad, diverse WHO-family exposure, or
  are they mostly repeated mentions from a small number of diagnosis families?

motivation: >
  H52 calibrated H44 against H23 by changed-row count, but hidden scoring may
  weight repeated mentions differently and rows are not independent trials.
  Before revealing an external H44 result, quantify exposure concentration so
  the result cannot later be overinterpreted as corpus-wide evidence.

frozen_inputs:
  h23_report: experiments/H23_candidate_only_semantic/build_report.json
  h44_report: experiments/H44_full_who_family_hedge/results/build_report.json
  h44_zip: turn2/output_v12_full_who_family_hedge.zip
  h44_zip_sha256: 5e451dd4f728ee2acecad80e364b5f750f11064941d1055031e7653aed3c83ba

normalization:
  mention: NFKC_unicode_then_casefold_then_collapse_whitespace
  parent_family: first_candidate_after_change
  specific_code: last_candidate_after_change
  lexical_unit: [normalized_mention, specific_code]

registered_metrics:
  for_each_of: [H23, H44]
  measures:
    - changed_rows
    - affected_records
    - unique_parent_families
    - unique_specific_codes
    - unique_lexical_units
    - effective_parent_families_inverse_simpson
    - effective_specific_codes_inverse_simpson
    - effective_lexical_units_inverse_simpson
    - top_1_parent_row_share
    - top_5_parent_row_share
    - top_10_lexical_unit_row_share
  cross_experiment:
    - parent_family_overlap
    - specific_code_overlap
    - lexical_unit_overlap

registered_gates:
  broad_family_exposure: >
    H44 has at least 20 unique parent families, effective parent-family count
    at least 20, and top-five parent-family row share at most 0.50.
  broad_lexical_exposure: >
    H44 has at least 100 effective lexical units and the top-ten lexical-unit
    row share is at most 0.25.
  reproducibility: two independent calculations produce byte-identical JSON.

interpretation_policy:
  both_broad: >
    An external H44 result may be described as broad family-and-lexical
    transfer, while still not treating rows as statistically independent.
  family_only: >
    The result supports broad family coverage but repeated surface forms limit
    lexical generalization.
  lexical_only: >
    Surface-form diversity is broad but family concentration limits ontology-
    wide generalization.
  neither_broad: >
    The result is evidence for a concentrated repeated-family intervention,
    not a corpus-wide hierarchy policy.
  invariant: >
    This audit changes only interpretation. It must not change H44's ZIP,
    numerical external gates, submission priority, or create a new artifact.

failure_policy: >
  If input counts, candidate shapes, H44 ZIP hash, or reproducibility fail,
  stop and do not revise the H44 interpretation tree from these results.
