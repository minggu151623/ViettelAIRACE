question: >
  Can a constrained medication candidate mixture-of-experts extend the
  externally supported brand-identity mechanism to longer, concatenated,
  misspelled and corpus-defined medication mentions without changing entity
  matching or assertions?

prediction: >
  Candidate Jaccard will improve because exact brand identity already produced
  a 2.3505-point external gain in H69. A trie-style segmenter can recover the
  same identities inside concatenated medication strings, while exact
  within-corpus equivalence can fill a small set of currently empty concrete
  medications. WER and assertion Jaccard must remain exactly H69-equivalent.

experts:
  bounded_unique_rxnorm_brand:
    source: H71 preregistered exact BN completion
    rules:
      - one active BN alias at word boundaries
      - exact repeated drug identity has one unconflicted singleton code
  concatenated_medication_segmenter:
    rules:
      - segment only identities already observed as exact medication mentions
      - prefer externally supported BN identity for embedded brands
      - preserve source-text order and every independently identified component
      - forbid arbitrary fuzzy RxNorm search
  corpus_identity_repair:
    allowed_mentions:
      - Pimperam
      - glucose 5% x 1000ml
      - Aquima
    rules:
      - Pimperam may inherit metoclopramide only from the near-identical Pimperan
      - glucose may inherit the corpus dextrose ingredient identity
      - bare Aquima may inherit only ingredients observed in the expanded Aquima mention

frozen_fields:
  - all_entities_and_order
  - text_type_position_assertions
  - all_diagnosis_candidates
  - all_unselected_drug_candidates

prohibited:
