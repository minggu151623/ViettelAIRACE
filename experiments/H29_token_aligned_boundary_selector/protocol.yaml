hypothesis: H29_token_aligned_boundary_selector
status: preregistered
created_at: "2026-08-02T23:35:00+07:00"
question: >
  Does a coverage-complete token-boundary candidate set let the frozen H28
  selector recover complete spans without damaging already-correct spans?

relationship_to_H28:
  retained:
    - qwen3_8b_model_and_exact_model_id
    - temperature_zero_seed_4817
    - boundary_completeness_prompt
    - first_or_last_token_corruption
    - corrupted_and_unchanged_control_pair
    - dev_before_test_failure_policy
  changed_before_any_H29_model_decision:
    - expansion_radius_from_4_to_7_tokens
    - enumerate_both_raw_and_outer_punctuation_trimmed_token_spans
    - exclude_pseudo_targets_not_representable_by_token_boundaries

data:
  input: turn2/input
  pseudo_target: turn2/output_v8_candidate_semantic
  split_source: airace.proposal_pu.DEFAULT_DEV_DEFAULT_TEST
  types:
    - CHẨN_ĐOÁN
    - TRIỆU_CHỨNG
    - TÊN_XÉT_NGHIỆM
    - KẾT_QUẢ_XÉT_NGHIỆM
    - THUỐC
  minimum_tokens: 2
  maximum_tokens: 8
  eligibility: >
    Target endpoints must equal one of the raw or outer-punctuation-trimmed
    token-span variants. Mid-token pseudo-targets are excluded and counted.

candidate_enumeration:
  scope: same_line
  seed_must_be_contained: true
  maximum_tokens: 10
  maximum_left_tokens: 7
  maximum_right_tokens: 7
  variants_per_token_span:
    - raw
    - trim_outer_punctuation
  include_exact_seed: true
  include_DROP: true
  required_eligible_coverage: 1.0

selector:
  model: qwen3:8b
  ollama_id: 500a1f067a9f
  temperature: 0
  seed: 4817
  prompt: unchanged_from_H28
  output: one_enumerated_choice_id_or_DROP
  may_invent_or_edit_span: false
  type_is_frozen: true

evaluation:
  dev_gate_before_test:
    - eligible_enumerator_coverage_equals_1
    - corrupted_exact_recovery_at_least_0_70
    - unchanged_control_retention_at_least_0_93
    - malformed_response_rate_equals_0
  final_test_gate:
    - corrupted_exact_recovery_at_least_0_65
    - unchanged_control_retention_at_least_0_90
    - no_type_has_corrupted_recovery_below_0_45_when_support_at_least_10
    - byte_identical_cached_rebuild

application_gate:
  prerequisite: all_dev_and_test_gates_pass
  source: H27_unanimous_KEEP_candidates
  action: separately_preregister_real_candidate_boundary_repair
  submission_rule: no_ZIP_from_synthetic_boundary_metrics_alone

failure_policy: >
  Cancel test if dev fails. Do not change prompt, choices, thresholds or model
  after H29 dev decisions. Record failure and start a genuinely new mechanism.
