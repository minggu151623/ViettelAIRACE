hypothesis: H32_five_fold_out_of_fold_high_confidence_voter
status: preregistered
created_at: "2026-08-03T01:30:00+07:00"
question: >
  Does H31's high-confidence behavior persist when every one of the 100 records
  is predicted by a weak-label token model that never trained or validated on
  that record?

data:
  input: turn2/input
  weak_labels: turn2/output_v8_candidate_semantic
  records: 100
  warning: H23_is_not_organizer_ground_truth

folds:
  count: 5
  construction: shuffle_record_ids_1_to_100_with_python_random_seed_9191_then_round_robin
  per_fold:
    inference: current_fold_20_records
    validation: next_fold_cyclic_20_records
    training: remaining_60_records
  invariant: inference_record_never_used_for_training_or_validation_in_its_model

model:
  base: models/bami-airace-v15-weighted
  model_sha256: 1037051cdd398a5466370c895ac0bfe69c28beb308e7131741c9f06053372f3d
  full_fine_tuning: true
  max_length: 256
  stride: 64
  epochs_max: 8
  patience: 2
  learning_rate: 0.00002
  batch_size: 4
  gradient_accumulation: 4
  class_weighting: true
  seed_per_fold: 4331_plus_fold_index

decoding:
  confidence_threshold: 0.90
  source: frozen_from_H31
  threshold_retuning: forbidden

evaluation:
  aggregate_gate:
    - exact_span_type_precision_at_least_0.78
    - exact_span_type_F1_at_least_0.55
    - exact_span_type_recall_at_least_0.40
    - every_fold_precision_at_least_0.70
    - offset_errors_equal_0
  failure: no_source_agreement_analysis_if_aggregate_gate_fails

independent_agreement_if_passed:
  novel_definition: exact_span_type_absent_from_H23
  eligible_sources:
    - H26_train_only_phrase_policy
    - H15_VietMed_proposal_bank
  excluded_as_independent:
    - Bami_v15_proposal_bank
    - Bami_v3_proposal_bank
  reason: same_model_family_as_H32
  report:
    - novel_H32_plus_H26_exact_count
    - novel_H32_plus_VietMed_exact_count
    - three_source_exact_count
    - contexts_and_offsets_for_manual_audit

promotion_policy: >
  Passing H32 promotes an out-of-fold voter and an auditable novel-agreement
  queue only. It does not authorize direct merge, ZIP creation or submission.
