confirmatory_architecture:
  candidate_universe: >
    Exact spans from the five frozen base views plus their token-aligned overlap
    components. H37/H38 membership is a prior feature only and never counts as
    an additional independent vote.
  latent_span_type_model:
    labels: [DROP, CHẨN_ĐOÁN, TRIỆU_CHỨNG, TÊN_XÉT_NGHIỆM, KẾT_QUẢ_XÉT_NGHIỆM, THUỐC, THÔNG_TIN_BỆNH_NHÂN]
    method: >
      EM label model with per-type source confusion matrices and pairwise
      dependency penalties. Bami-v15 and Bami-v3 are one declared correlated
      family; empirical residual dependencies among other views are estimated
      only on training record folds.
    folds: 5_record_disjoint_seed_3901
  contextual_stacker:
    method: >
      Cross-fitted multinomial classifier over frozen Qwen mention/context
      embeddings, source votes, section, boundary shape, dependency-aware
      posterior and ontology compatibility. It trains on soft posterior targets,
      never on H38 hard decisions.
  assertion_heads:
    method: >
      Three independent cross-fitted binary heads for isHistorical, isNegated
      and isFamily using section/rule/LLM votes. The final assertion is attached
      only after the final span boundary is selected.
  ontology_decoder:
    method: >
      Type-routed candidate pool from the frozen H24 sparse+dense retriever,
      constrained by WHO/RxNorm graph compatibility. Abstain when independent
      candidate sources do not support a nonempty code.
  overlap_decoder: weighted_interval_scheduling_on_calibrated_posteriors

controls:
  positive: frozen_H38_positive_controls
  negative: frozen_H38_registered_hazards_plus_numeric_measurement_controls
  independence_rule: >
    Derived artifacts H37 and H38 cannot increase source support. Two Bami
    checkpoints cannot contribute more than one family vote to a control gate.

synthetic_correlated_noise_benchmark:
  task: binary_KEEP_DROP
  examples: 20000
  positive_prevalence: 0.35
  seed: 3901
  anchored_controls: 500_stratified
  source_noise:
    bami_family_shared_flip_probability: 0.42
    bami_v15_independent_flip_probability: 0.02
    bami_v3_independent_flip_probability: 0.02
    vietmed_independent_accuracy: 0.82
    qwen_guarded_independent_accuracy: 0.76
    h34_oof_independent_accuracy: 0.70
  metric: positive_class_F1
  baseline: unweighted_five_source_majority

leave_one_family_out_definition: >
  On the real frozen candidate universe, remove one source family, fit the label
  model on the remaining families using training record folds, and predict the
  held-out family's observed non-abstain vote. Compare binary vote log-loss with
  unweighted majority among the same remaining families. Evaluate each entity
  type having at least 20 held-out non-abstain observations; this is a source-
  prediction stability test, not organizer-ground-truth accuracy.

gates_before_artifact:
  - frozen_hashes_match
  - synthetic_correlated_noise_F1_exceeds_majority_by_at_least_0.05
  - every_type_with_at_least_20_controls_has_leave_one_family_out_logloss_gain
  - positive_control_retention_at_least_0.90
  - registered_and_numeric_hazard_drop_rate_equals_1
  - posterior_rank_correlation_across_three_seeds_at_least_0.98
  - assertion_heads_do_not_regress_on_any_record_heldout_proxy_split
  - ontology_decoder_never_emits_an_unsupported_code
  - all_100_records_validate
  - repeated_output_and_zip_are_byte_identical

failure_policy: >
  Do not turn H38-derived outputs into extra votes, relax a gate, tune a
  posterior threshold against the leaderboard, or create a submission ZIP from
  a failed run. A failed label model returns to independent annotation/source
  acquisition rather than another consensus variant.

