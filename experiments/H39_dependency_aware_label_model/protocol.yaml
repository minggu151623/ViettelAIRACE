hypothesis: H39_dependency_aware_joint_label_model
status: failed_before_stacker
created_at: "2026-08-02T23:59:00+07:00"
question: >
  Can a dependency-aware latent label model learn type-specific reliability and
  correlation among weak proposal sources, then train a contextual stacker that
  improves coverage beyond exact voting without repeating H38's low-yield
  majority-consensus expansion?

motivation:
  H38_external_score: 39.2813
  delta_over_H37: 0.3093
  observation: >
    H38 changed 183 rows but gained only 0.3093. Exact majority voting treats
    Bami-v15, Bami-v3 and related weak-label descendants as independent even
    though they share training ancestry. More threshold tuning is closed.

