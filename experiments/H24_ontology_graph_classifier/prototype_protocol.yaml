experiment: H24_clinical_mention_prototypes
status: preregistered_before_evaluation
registered_at: "2026-08-02T08:37:00+07:00"
fallback_artifact: turn2/output_v8_candidate_semantic.zip
motivation: >
  Alignment-only memorized the 426 weak train rows because two random
  projection heads saw only in-batch negatives. This ablation removes all
  learned parameters and tests whether Vietnamese clinical mentions already
  form useful clusters in the frozen encoder space.
data:
  dataset: experiments/H24_ontology_graph_classifier/link_dataset.json
  dataset_sha256: c78f3c57afe038a0f9ff06e20b39475e2ad5e83d67fb2c6e46c161e0489b9aaf
  label_status: weak_pseudo_labels_not_organizer_ground_truth
  prototype_source_fold: train_only
  evaluation_folds: [dev, test]
  leakage_control: no_dev_or_test_mention_contributes_to_a_prototype
backbone:
  path: models/bami-airace-v15-weighted
  model_sha256: 1037051cdd398a5466370c895ac0bfe69c28beb308e7131741c9f06053372f3d
  policy: frozen_exact_base_embeddings_no_projection_no_fitting
  pooling: masked_mean
retrieval:
  ontology_nodes: 69991
  type_restricted: true
  prototype_rule: normalized_mean_of_train_mention_embeddings_per_concept
  seen_concept_rule: replace_english_canonical_embedding_with_clinical_prototype
  unseen_concept_rule: retain_frozen_canonical_embedding
  tie_break: stable_concept_identifier
  top_k: [1, 5, 10]
evaluation:
  report_by: [fold, entity_type, seen_vs_unseen_concept]
  compare_against:
    lexical_overall_recall_at_1: 0.10810810810810811
    unadapted_dense_overall_recall_at_1: 0.04054054054054054
    alignment_only_dev_recall_at_1: 0.027777777777777776
    alignment_only_test_recall_at_1: 0.0
  test_policy: one_deterministic_pass_without_hyperparameter_selection
promotion_gate:
  require_dev_and_test_recall_at_1_above_unadapted_dense: true
  require_seen_concept_test_recall_at_1_above_alignment_only: true
  require_no_unseen_concept_regression_vs_unadapted_dense: true
  leaderboard_is_not_used_for_selection: true
failure_policy:
  - Preserve H23 when the prototype retriever fails the internal gate.
  - Do not add graph propagation to a prototype representation that does not generalize.
  - If prototypes help seen concepts only, preregister lexical fallback before any hybrid run.
  - Do not create a challenger ZIP from weak-link retrieval alone.
