tree:
  - id: N31
    type: pivot
    title: "Pivot from candidate lists to ontology-aware model core"
    provenance: ai-suggested
    timestamp: "2026-08-02T07:35+07:00"
    from: "Post-hoc parent/specific candidate-list expansion"
    to: "Graph-aligned retrieval plus contextual classification"
    trigger: >
      H23 improved 38.7976 to only 38.9352; WER and assertions were frozen and
      the full gain came from a 0.3441 candidate-Jaccard increase.
    children:
      - id: N32
        type: experiment
        title: "H24 graph construction and lexical retrieval baseline"
        provenance: ai-executed
        timestamp: "2026-08-02T07:50+07:00"
        result: >
          Built 69,991 concept nodes and 294,548 typed edges, then evaluated
          518 provenance-marked weak links. Character TF-IDF reached 10.81%
          R@1 overall and 2.62% on diagnoses, leaving a frozen target for the
          adapted dense+graph model. All 72 repository tests passed.
        evidence: [C25, C26,
          "experiments/H24_ontology_graph_classifier/graph_manifest.json",
          "experiments/H24_ontology_graph_classifier/lexical_baseline.json"]
        children:
          - id: N33
            type: dead_end
            title: "Alignment heads overfit 518 weak links"
            provenance: ai-executed
            timestamp: "2026-08-02T09:30+07:00"
            failure_mode: >
              Alignment-only training raised train R@1 to 30.28% but produced
              2.78% dev and 0% test R@1 over the full ontology. The frozen
              lexical gate failed, so the graph-training variant was canceled.
            lesson: >
              Random projections and in-batch negatives cannot replace a
              retrieval-pretrained multilingual geometry at this label scale.
            evidence: [C27,
              "experiments/H24_ontology_graph_classifier/alignment_only/report.json"]
          - id: N34
            type: experiment
            title: "Dedicated multilingual retrieval and type-specialist routing"
            provenance: ai-executed
            timestamp: "2026-08-02T12:30+07:00"
            result: >
              Qwen3 Embedding expanded candidate-pool recall, then a frozen
              zero-parameter router used Qwen for diagnoses and character
              TF-IDF for drugs. Dev/test R@1 reached 16.67/17.86% and R@5
              reached 25.00/30.36%, clearing all four registered gates against
              lexical retrieval.
            evidence: [C27, C28,
              "experiments/H24_ontology_graph_classifier/qwen_multilingual/report.json",
              "experiments/H24_ontology_graph_classifier/type_specialist/report.json"]
            children:
              - id: N35
                type: dead_end
                title: "Generic reranker and graph features fail the router gate"
                provenance: ai-executed
                timestamp: "2026-08-02T16:30+07:00"
                failure_mode: >
                  The official Qwen reranker with exact graph relations tied
                  the router on test R@1/R@5, while train-only semantic and
                  graph classifiers left dev R@1 unchanged at 16.67%.
                lesson: >
                  The 518 H23-derived links can evaluate candidate generation
                  but cannot safely fit another generic ranking layer.
                evidence: [C29, C30,
                  "experiments/H24_ontology_graph_classifier/reranker/report.json",
                  "experiments/H24_ontology_graph_classifier/feature_classifier/report.json"]
              - id: N36
                type: pivot
                title: "Move H24 outer loop to span, type and assertion"
                provenance: ai-suggested
                timestamp: "2026-08-02T18:30+07:00"
                from: "Further weak-link reranker fitting"
                to: "Record-held-out positive-unlabeled proposal classification"
                trigger: >
                  Linker R@1 saturated while the external H23 WER and assertion
                  metrics, 57.2161 and 47.5455, retain larger score headroom.
                evidence: [C30,
                  "experiments/H24_ontology_graph_classifier/README.md"]
                children:
                  - id: N37
                    type: dead_end
                    title: "H25 contextual positive-unlabeled calibration"
                    provenance: ai-executed
                    timestamp: "2026-08-03T00:30+07:00"
                    hypothesis: >
                      Record-held-out proposal features can recover H23-like
                      additions without treating every missing label as false.
                    failure_mode: >
                      Dev/test strict-F1 gains were only 0.39/0.40 points and
                      addition precision was 41.67/36.84%; assertion transfer
                      also changed direction across splits.
                    lesson: >
                      Correlated proposal confidence cannot serve as the only
                      independent evidence for novel spans.
                    evidence: ["experiments/H25_positive_unlabeled_span_assertion/results/report.json"]
                  - id: N38
                    type: experiment
                    title: "H26 train-only phrase-policy transfer"
                    provenance: ai-executed
                    timestamp: "2026-08-03T01:00+07:00"
                    result: >
                      A 235-phrase train-only lexicon improved dev/test strict
                      F1 by 4.08/1.32 points, but addition precision remained
                      50.59/36.11%. It was retained only as an independent
                      proposal source.
                    evidence: ["experiments/H26_phrase_policy_distillation/results/report.json"]
                    children:
                      - id: N39
                        type: dead_end
                        title: "Prompt-only phrase and boundary verification"
                        provenance: ai-executed
                        timestamp: "2026-08-03T01:40+07:00"
                        hypothesis: >
                          Frozen KEEP/DROP and token-choice prompts can repair
                          noisy phrase boundaries without supervised labels.
                        failure_mode: >
                          H27 missed its precision-improvement gate; H28 lacked
                          choice coverage; H29 recovered only 37.07% of damaged
                          spans and retained 70.13% of correct controls.
                        lesson: >
                          Generic semantic completeness is not BTC boundary
                          policy; train a token classifier and use prompts only
                          after independent agreement.
                        evidence: ["experiments/H27_phrase_verifier/results/report.json",
                          "experiments/H29_boundary_selector_v2/results/report.json"]
                      - id: N40
                        type: experiment
                        title: "H30/H31 weak-label token adaptation and calibration"
                        provenance: ai-executed
                        timestamp: "2026-08-03T02:20+07:00"
                        result: >
                          H30 reached 57.44/72.46/64.08% dev P/R/F1. Freezing
                          the checkpoint and selecting threshold 0.90 on dev
                          raised precision to 81.60% dev and 84.53% test, so
                          H31 was promoted only as a high-confidence voter.
                        evidence: [C31,
                          "experiments/H31_confidence_calibration/results/report.json"]
                        children:
                          - id: N41
                            type: dead_end
                            title: "H32/H33 cross-fold confidence collapse"
                            provenance: ai-executed
                            timestamp: "2026-08-03T02:50+07:00"
                            hypothesis: >
                              Global or per-fold confidence calibration can
                              directly yield complete OOF predictions.
                            failure_mode: >
                              Aggregate F1 was 50.89/52.02%, and one early-
                              stopped fold emitted no selected spans.
                            lesson: >
                              Calibration cannot repair a checkpoint retained
                              before its confidence geometry matures.
                            evidence: [C32,
                              "experiments/H33_per_fold_calibration/results/report.json"]
                          - id: N42
                            type: experiment
                            title: "H34 minimum-epoch fold recovery"
                            provenance: ai-executed
                            timestamp: "2026-08-03T03:10+07:00"
                            result: >
                              Enforcing five minimum epochs repaired the empty
                              fold to 54.35% F1 and the substituted aggregate
                              to 82.23/46.15/59.12% P/R/F1. A fold recall gate
                              missed by 0.57 points, so no direct merge followed.
                            evidence: [C32,
                              "experiments/H34_minimum_epoch_recovery/results/report.json"]
                            children:
                              - id: N43
                                type: experiment
                                title: "H35 independent agreement audit"
                                provenance: ai-executed
                                timestamp: "2026-08-03T03:30+07:00"
                                result: >
                                  Reduced 316 H34-new spans to 51 exact
                                  independent agreements, while detecting two
                                  known fused-token hazards in the queue.
                                evidence: [C33,
                                  "experiments/H35_independent_agreement_audit/results/report.json"]
                                children:
                                  - id: N44
                                    type: experiment
                                    title: "H36 controlled dual verification"
                                    provenance: ai-executed
                                    timestamp: "2026-08-03T03:50+07:00"
                                    result: >
                                      Retained 27/30 positive controls, dropped
                                      both hazards, reached 92.59% prompt
                                      agreement, and accepted 42/51 novel rows.
                                    evidence: [C33,
                                      "experiments/H36_controlled_novel_verifier/results/report.json"]
                                    children:
                                      - id: N45
                                        type: experiment
                                        title: "H37 verified symptom-boundary integration"
                                        provenance: ai-executed
                                        timestamp: "2026-08-02T11:50+07:00"
                                        result: >
                                          Replaced 21 inflated H23 symptom rows
                                          with 22 verified cores, added four
                                          disjoint symptoms, skipped three type
                                          conflicts, and produced a 100-record
                                          deterministic candidate ZIP. External
                                          score rose only 0.0368 to 38.9720;
                                          WER improved while assertions fell.
                                        evidence: [C34,
                                          "experiments/H37_verified_symptom_boundary/results/report.json",
                                          "turn2/output_v9_verified_symptoms.zip"]
                                        children:
                                          - id: N46
                                            type: experiment
                                            title: "H38 five-view exact consensus"
                                            provenance: ai-executed
                                            timestamp: "2026-08-02T14:30+07:00"
                                            result: >
                                              Exact 3-of-5 agreement plus frozen
                                              dual verification selected 183
                                              rows across 68 records. It retained
                                              91.67% of positive controls, rejected
                                              all 21 hazards, validated all files,
                                              passed 111 tests and reproduced
                                              byte-identical ZIPs. User-reported
                                              external score was 39.2813, only
                                              +0.3093: text and candidates rose
                                              while assertions slipped.
                                            evidence: [C35,
                                              "experiments/H38_multiview_consensus/results/report.json",
                                              "experiments/H38_multiview_consensus/external_result.json"]
                                            children:
                                              - id: N47
                                                type: pivot
                                                title: "Replace majority voting with a dependency-aware label model"
                                                provenance: ai-suggested
                                                timestamp: "2026-08-02T23:59+07:00"
                                                from: "Exact thresholded consensus among correlated proposal models"
                                                to: "Latent source-reliability model plus cross-fitted joint stacker"
                                                trigger: >
                                                  H38 needed 183 selected changes
                                                  for only +0.3093, establishing
                                                  that same-family consensus has
                                                  positive but insufficient yield.
                                                evidence: [C35, C36,
                                                  "experiments/H39_dependency_aware_label_model/protocol.yaml"]
  - id: N27
    type: decision
    title: "Use the first reset submission as an H22 confirmation"
    provenance: user
    timestamp: "2026-08-02T05:00+07:00"
    choice: >
      Continue improving after the daily five submissions reset and prepare one
      new artifact for the user's first submission.
    alternatives:
      - "Resubmit frozen H20"
      - "Spend the first slot on another H20 threshold micro-variant"
    evidence: >
      The user explicitly requested a new improvement and stated they would
      perform submission one after delivery.
    children:
      - id: N28
        type: experiment
        title: "H22 calibrated pseudo-label reconstruction"
        provenance: ai-executed
        timestamp: "2026-08-02T05:30+07:00"
        result: >
          Audited collaborator commit 91ce0c6 as a proxy containing 3,168
          raw-aligned annotations and 940 synthetic out-of-range rows. The
          untouched proxy reproduced H20 at 29.8525 versus 29.8409 external.
          After preregistration, H22 removed all synthetic rows, validated
          100/100 records, passed 63 tests, and packaged byte-identically with
          SHA-256 03651cfea61d989cb3fd5574828d912a04752aca6eb7a0ff2f04f37f4c283ade.
          It scored 87.0650 in-sample on the proxy and awaits external testing;
          no organizer submission was performed by the AI.
        evidence: [C22, "experiments/H22_calibrated_pseudo_reconstruction/proxy_comparison.json",
          "turn2/output_v7_pseudo_reconstruction.zip"]
        children:
          - id: N29
            type: experiment
            title: "H22 external leaderboard confirmation"
            provenance: user
            timestamp: "2026-08-02T06:59+07:00"
            result: >
              The user submitted the matching 03651cfea61d... archive and
              reported 38.7976, up 8.9567 from H20. WER improved to 57.2161,
              assertion Jaccard to 47.5455, and candidate Jaccard to 29.2469.
              All three components improved. The proxy selected the correct
              direction but overestimated the absolute result by 48.2674.
            evidence: [C22, C23,
              "experiments/H22_calibrated_pseudo_reconstruction/external_result.json"]
            children:
              - id: N30
                type: experiment
                title: "H23 same-family WHO parent hedge"
                provenance: ai-executed
                timestamp: "2026-08-02T07:30+07:00"
                result: >
                  Preregistered candidate-only invariants, audited 863 H22
                  diagnoses, and added a valid same-family WHO parent beside
                  144 singleton ICD-10-CM-specific codes. One two-family row
                  was quarantined. All 3,168 entities and every non-candidate
                  field remain unchanged; 65 tests and 100-record validation
                  pass. Repeated SHA-256 is
                  e1fc83b8e53cd9d4ac3f5d7f072a4f34eb46ee7841243a52f690ae8645514662.
                  External effect is pending and no submission was performed.
                evidence: [C24,
                  "experiments/H23_candidate_only_semantic/build_report.json",
                  "turn2/output_v8_candidate_semantic.zip"]
  - id: N25
    type: decision
    title: "Adopt an isolated blind-evaluation track"
    provenance: user
    timestamp: "2026-08-02T00:00+07:00"
    choice: >
      Keep the 29.8409 baseline frozen and begin the previously proposed blind
      validation plan in a separate experiment directory.
    alternatives:
      - "Continue selecting variants directly from scarce leaderboard feedback"
      - "Replace H20 with an unvalidated challenger"
    evidence: >
      The user explicitly requested implementation after discussing the risk
      that an internally strong proxy could regress on organizer labels.
    children:
      - id: N26
        type: experiment
        title: "H21 prediction-blind promotion infrastructure"
        provenance: ai-executed
        timestamp: "2026-08-02T00:30+07:00"
        result: >
          Preregistered a six-stratum 18-record queue, then selected 12
          development and 6 holdout records from raw structure only. Added
          corpus/record fingerprints, empty-prefill annotation routing, paired
          10,000-sample bootstrap evaluation, strict span/type guards and a
          fail-closed promotion decision. Manifest regeneration was
          byte-identical; missing annotations returned
          INCOMPLETE_ANNOTATIONS; H20 remained valid on 100 records and all 61
          tests passed. No challenger quality claim is made before annotation.
        evidence: [C21, "experiments/H21_blind_promotion_gate/analysis.md",
          "experiments/H21_blind_promotion_gate/calibration_manifest.json",
          "tests/test_blind_eval.py"]
  - id: N21
    type: pivot
    title: "Turn 2 breakthrough rebuild after 21.8139 plateau"
    provenance: user
    timestamp: "2026-08-01T14:40+07:00"
    from: "Small pair-recall increments on H17"
    to: "Ontology reconstruction plus architecture-scale learned recall"
    trigger: >
      The user reported H17 at 21.8139 and explicitly requested a breakthrough
      rather than another small blind variant.
    children:
      - id: N22
        type: dead_end
        title: "Direct H18 WHO candidate selector"
        provenance: ai-executed
        timestamp: "2026-08-01T14:55+07:00"
        hypothesis: >
          A Qwen proposer/reviewer over the WHO catalogue can repair diagnosis
          candidates without touching spans.
        failure_mode: >
          Implementation preserved old codes after reviewer rejection, mixed
          unrelated ICD families, and admitted confidence values above 1.0.
        lesson: >
          Reviewer authority, family consistency, and bounded confidence must
          be enforced deterministically before packaging.
      - id: N23
        type: experiment
        title: "H19 reviewer-authoritative WHO reconstruction"
        provenance: ai-executed
        timestamp: "2026-08-01T15:05+07:00"
        result: >
          Changed 189 diagnosis candidate fields (62 fills, 127 repairs/prunes)
          while freezing every other field. All 100 records and 57 tests pass;
          repeated ZIP hash is 26c8fa1d31dcebeb3019dfe5890abf4f7a264c6b27fd46c532ef7dc13a870104.
        evidence: [C18, "experiments/H19_turn2_who_precision/selection.json",
          "turn2/output_v5_who_precision.zip"]
      - id: N24
        type: experiment
        title: "H20 expanded learned-pair recall"
        provenance: ai-executed
        timestamp: "2026-08-01T15:50+07:00"
        also_depends_on: [N23]
        result: >
          Reviewed 529 disjoint exact two-model spans, detected copied Qwen
          confidence, and selected 500 additions using type-specific evidence.
          The 2,450-entity artifact validates 100/100, passes 57 tests, and has
          deterministic SHA-256 ad5ac42a2fc3d0105537c42873d4aaeba1e24aef57ec9510216cf32f43d25691.
          The user submitted this matching artifact and reported 29.8409:
          WER 66.7969, J_assertion 37.7055, and J_candidates 21.4207. This is
          +8.0270 over H17 and every component improved.
        evidence: [C19, C20, "experiments/H20_turn2_expanded_pair/selection.json",
          "experiments/H20_turn2_expanded_pair/analysis.md",
          "turn2/output_v6_expanded_pair.zip"]
  - id: N01
    type: question
    title: "How to move beyond the V6 score plateau without ground truth"
    provenance: user
    timestamp: "2026-07-27T22:00+07:00"
    description: >
      Improve the competition pipeline materially rather than spend scarce
      submissions on formatting changes and small blind tweaks.
    children:
      - id: N02
        type: experiment
        title: "Activate and class-balance the real BamiBERT checkpoint"
        provenance: ai-executed
        timestamp: "2026-07-27T22:20+07:00"
        result: >
          Repaired model activation. Weighted training improved reviewed-holdout
          strict F1 from 0.690476 to 0.867470.
        evidence: [C01, C02, "models/bami-airace-v15-weighted/training_report.json"]
        children:
          - id: N03
            type: dead_end
            title: "Raw specialist union"
            provenance: ai-executed
            timestamp: "2026-07-27T22:35+07:00"
            hypothesis: >
              Route learned symptoms, diagnoses, and tests directly to the
              submission while V6 supplies sparse classes.
            failure_mode: >
              The union introduced more than 600 additions with no unbiased
              precision estimate.
            lesson: >
              A learned model must be evidence-gated rather than unioned.
          - id: N04
            type: experiment
            title: "V16 teacher-student consensus"
            provenance: ai-executed
            timestamp: "2026-07-27T22:55+07:00"
            result: >
              Preserved V6 and added 169 high-confidence non-overlapping
              consensus mentions. All 100 records validate, 32 tests pass, and
              repeat packages are byte-identical. External score is pending.
            evidence: [C03, "reports/v16_teacher_student.json"]
          - id: N05
            type: experiment
            title: "H7 CRLF coordinate projection"
            provenance: ai-executed
            timestamp: "2026-07-27T23:22+07:00"
            result: >
              Projected only LF positions to CRLF positions for the exact V6
              artifact. All 2,254 semantic records remained identical; 2,246
              entities moved. Validation passed and repeated ZIPs were
              byte-identical. External score is pending.
            evidence: [C04, "reports/v17_crlf_positions.json", "output_v17_crlf_positions.zip"]
          - id: N06
            type: experiment
            title: "H8 official-policy and RxNorm semantic audit"
            provenance: ai-executed
            timestamp: "2026-07-27T23:50+07:00"
            result: >
              Official forum comments confirmed repeated-occurrence,
              textual-result, unit, and multilabel-assertion policies. All 79
              unique V6 RxCUIs were Active, but at least 15 uses contradicted
              mention ingredients, strength, or route. No submission artifact
              was generated.
            evidence: [C05, "experiments/H_rxnorm_active_audit/results.json",
              "literature/official_forum_policy_2026-07-27.md"]
          - id: N07
            type: experiment
            title: "H7 archive-provenance consistency check"
            provenance: ai-executed
            timestamp: "2026-07-28T00:12+07:00"
            result: >
              All 101 input.zip entries declare MS-DOS/NT FAT origin, while
              the 100 text files contain 2,889 LF bytes and zero CR bytes.
              Together with the exact official CRLF offsets and near-zero V6
              text credit, this strengthens the newline-normalization
              mechanism. External score remains pending.
            evidence: [C04, "experiments/H_crlf_coordinate_reconstruction/analysis.md"]
          - id: N08
            type: experiment
            title: "Recover pre-round organizer overview example"
            provenance: ai-executed
            timestamp: "2026-07-28T00:32+07:00"
            result: >
              A public snapshot confirmed that diagnosis gold may contain both
              parent and specific ICD candidates. The same snapshot contains
              WBC/TWBC and drug-strength inconsistencies, so it was retained as
              policy evidence rather than character-exact gold.
            evidence: [C06, "literature/organizer_overview_example.md"]
          - id: N09
            type: experiment
            title: "H9 structured-field coverage audit"
            provenance: ai-executed
            timestamp: "2026-07-28T00:52+07:00"
            result: >
              V6 covered 95-100% of non-empty explicit diagnosis, symptom,
              admission-reason, test-result, imaging-result, and chronic-
              disease fields. This rules out catastrophic semantic-field recall
              as the mechanism behind 0.0398% official text credit.
            evidence: [C07, "experiments/H_structured_field_coverage/analysis.md"]
          - id: N10
            type: experiment
            title: "H10 i2b2 annotation-policy correspondence"
            provenance: ai-executed
            timestamp: "2026-07-28T01:12+07:00"
            result: >
              Primary i2b2 sources show strong type, assertion, occurrence, and
              boundary correspondence with BTC. BTC-specific multilabel and
              historical-drug behavior prevents direct label conversion.
            evidence: [C08, "literature/i2b2_policy_mapping.md"]
          - id: N11
            type: experiment
            title: "Primary i2b2 guideline rule extraction"
            provenance: ai-executed
            timestamp: "2026-07-28T02:05+07:00"
            result: >
              The official PDFs make the boundary prior operational: complete
              NP/AP spans, modifier retention, one-PP/body-part handling,
              shared-modifier list grouping, independent-list splitting,
              occurrence separation, and formatting-header exclusion. The
              assertion PDF documents Possible-over-Absent precedence, but its
              six exclusive labels are not BTC's multilabel schema.
            evidence: [C09, "literature/i2b2_guideline_extract.md"]
          - id: N12
            type: experiment
            title: "Official sample boundary-policy audit"
            provenance: ai-executed
            timestamp: "2026-07-28T02:25+07:00"
            result: >
              Visual inspection confirmed stable drug/indication boundaries and
              separate repeated occurrences. The same official sample keeps
              "sốt đau" together but splits "lo âu mất ngủ", falsifying any
              universal compound-symptom split or merge rule.
            evidence: [C10, "literature/official_sample_boundary_policy.md"]
          - id: N13
            type: experiment
            title: "H12 source-generation audit"
            provenance: ai-executed
            timestamp: "2026-07-28T02:45+07:00"
            result: >
              Repeated-heading counts show a dominant shared three-section
              template, while 26 files retain English clinical fragments. This
              supports translation/restructuring and bilingual section-aware
              modeling, but exact source-corpus provenance was not recovered.
            evidence: [C11, "experiments/H_source_generation/analysis.md"]
          - id: N14
            type: experiment
            title: "H12 named-source provenance assessment"
            provenance: ai-executed
            timestamp: "2026-07-28T03:05+07:00"
            result: >
              Primary i2b2 sources confirm matching task families and
              semi-structured hospital notes under DUA-controlled access, but
              no BTC record aligned to a source record. The task-family prior
              is supported; named-source label transfer remains unsupported.
            evidence: [C12, "literature/source_corpus_provenance_assessment.md"]
          - id: N15
            type: experiment
            title: "Independent candidate-stripping ablation"
            provenance: ai-executed
            timestamp: "2026-07-28T03:25+07:00"
            result: >
              A participant reported that the same 2,311 entities scored
              J_candidates 0 with codes and 0.8415 without codes; a fully empty
              submission scored 0.1933. This independently supports
              candidate abstention, subject to unaudited peer-report limits.
            evidence: [C13, "literature/forum_peer_blackbox_evidence_2026-07-27.md"]
          - id: N16
            type: experiment
            title: "H13 assertion experiencer audit"
            provenance: ai-executed
            timestamp: "2026-07-28T04:05+07:00"
            result: >
              Manual context review found that 18 of 19 V6 isFamily labels
              describe the patient rather than a relative; most confuse family
              reporter with family experiencer. V6 also assigns 15 assertions
              to test/result concepts. External isolation remains pending.
            evidence: [C14, "experiments/H_assertion_policy_audit/analysis.md"]
          - id: N17
            type: experiment
            title: "H14 test-name/result boundary audit"
            provenance: ai-executed
            timestamp: "2026-07-28T04:45+07:00"
            result: >
              At least 52 of V6's 156 numeric result spans contain an obvious
              test-name token; 18 result spans overlap a separately emitted
              test name. This contradicts the independent name/result taxonomy
              and motivates a separately evaluated lab-row splitter.
            evidence: [C15, "experiments/H_test_result_boundary_audit/analysis.md"]
          - id: N18
            type: experiment
            title: "V18 bounded evidence rebuild"
